<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>l57_event_obj.html 이벤트 객체</title>
</head>
<style>
    #box{
        height: 7em;
        background-color: pink;
        width: 7em;
    }
</style>
<body>
    <h1>이벤트 객체</h1>
    <div id="box">
        <b>box입니다.</b>
    </div>
    <script>
        const box=document.getElementById("box");
        //마우스이벤트 (click(down,up,db),enter(orver),leave(out),move,cotextmenu)
        box.addEventListener("mouseover",(event)=>{
            console.log(event);//MouseEvent
            //box.style.border="2px solid red";
            //event.target : 이벤트가 발생한 대상
            //target :부모요소에 이벤트를 정의했는데 이벤트 대상이 자식이면 target은 자식
            //event.target.style.border="2px solid red";
            event.currentTarget.style.border="2px solid red";
            //currentTarget : 이벤트를 정의한 요소
        })
        box.addEventListener("mouseout",(e)=>{
            e.target.style.border=""
            //e.target.style.borderWidth="0px"
        })

    </script>
</body>
</html>
