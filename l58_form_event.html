<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>l58_form_event.html 폼 이벤트 </title>
</head>
<body>
    <h1>폼 이벤트</h1>
    <!-- 
        get  => http://127.0.0.1:5500/login.do?userId=gildong&userPw=1234 
        post => http://127.0.0.1:5500/login.do (요청 본문 파라미터 포함)
    -->
    <form name="loginForm" action="login.do" method="post">
        <p><label>아이디 : <input type="text" name="userId" value="gildong"></label></p>
        <p><label>비번 : <input type="password" name="userPw" value="1234"></label></p>
        <p>
            <button type="submit">제출</button>
        </p>
    </form>
    <script>
        //console.log(loginForm);
        //console.log(document.forms.loginForm);
        const loginForm=document["forms"]["loginForm"];
        loginForm.onsubmit=(e)=>{
            //form 제출 막기 
            //1. 입력 데이터의 유효성 검사 (예 비밀번호가 8자리 이상, 아니면 제출 안됨)
            //2. SPA(React), AJAX(fetch)로 로그인할때 (페이지전환 없이 js로 로그인)
            e.preventDefault(); //이벤트를 멈추겠다.
            console.log("submit 버튼을 누르면 form에 submit 이벤트 발생!!");
            //loginForm.submit(); //js로 이벤트 직접 실행
        }
    </script>
</body>
</html>
